<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #a0a0a0; }
      .system-box { fill: #3B96E6; stroke: #2a7bc4; stroke-width: 3; }
      .actor-box { fill: #51B059; stroke: #3d8544; stroke-width: 3; }
      .external-box { fill: #808080; stroke: #606060; stroke-width: 3; }
      .box-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .box-type { font-family: Arial, sans-serif; font-size: 14px; fill: #e0e0e0; text-anchor: middle; font-style: italic; }
      .box-desc { font-family: Arial, sans-serif; font-size: 13px; fill: #f0f0f0; text-anchor: middle; }
      .arrow { stroke: #a0a0a0; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: Arial, sans-serif; font-size: 13px; fill: #d0d0d0; text-anchor: middle; }
      .legend-text { font-family: Arial, sans-serif; font-size: 14px; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#a0a0a0" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="800"/>

  <text class="title" x="600" y="40" text-anchor="middle">Location404 - C4 Model: System Context</text>
  <text class="subtitle" x="600" y="65" text-anchor="middle">Visão de alto nível do sistema e seus atores</text>

  <!-- Sistema Central: Location404 -->
  <rect class="system-box" x="450" y="300" width="300" height="160" rx="8"/>
  <text class="box-title" x="600" y="340">Location404</text>
  <text class="box-type" x="600" y="365">[Software System]</text>
  <text class="box-desc" x="600" y="390">Jogo multiplayer de</text>
  <text class="box-desc" x="600" y="410">geolocalização em tempo real</text>
  <text class="box-desc" x="600" y="430">com ranking e matchmaking</text>

  <!-- Ator: Jogadores -->
  <rect class="actor-box" x="100" y="320" width="200" height="120" rx="8"/>
  <text class="box-title" x="200" y="360">Jogadores</text>
  <text class="box-type" x="200" y="385">[Person]</text>
  <text class="box-desc" x="200" y="410">Usuários que jogam,</text>
  <text class="box-desc" x="200" y="430">competem e visualizam ranking</text>

  <!-- External System: Google Maps API -->
  <rect class="external-box" x="850" y="150" width="250" height="120" rx="8"/>
  <text class="box-title" x="975" y="190">Google Maps API</text>
  <text class="box-type" x="975" y="215">[External System]</text>
  <text class="box-desc" x="975" y="240">Fornece Street View e</text>
  <text class="box-desc" x="975" y="260">dados geográficos</text>

  <!-- External System: Google OAuth -->
  <rect class="external-box" x="850" y="350" width="250" height="120" rx="8"/>
  <text class="box-title" x="975" y="390">Google OAuth</text>
  <text class="box-type" x="975" y="415">[External System]</text>
  <text class="box-desc" x="975" y="440">Autenticação social</text>
  <text class="box-desc" x="975" y="460">com login Google</text>

  <!-- Arrows -->
  <!-- Jogadores → Location404 -->
  <path class="arrow" d="M 300 380 L 450 380"/>
  <text class="arrow-label" x="375" y="370">Joga partidas, visualiza</text>
  <text class="arrow-label" x="375" y="390">ranking e estatísticas</text>

  <!-- Location404 → Google Maps API -->
  <path class="arrow" d="M 720 330 L 870 240"/>
  <text class="arrow-label" x="795" y="270">Busca localizações</text>
  <text class="arrow-label" x="795" y="290">e coordenadas</text>

  <!-- Location404 → Google OAuth -->
  <path class="arrow" d="M 750 400 L 850 400"/>
  <text class="arrow-label" x="800" y="390">Autentica</text>
  <text class="arrow-label" x="800" y="410">usuários</text>

  <!-- Legend -->
  <rect class="system-box" x="50" y="650" width="30" height="20" rx="2"/>
  <text class="legend-text" x="90" y="665">Software System (Location404)</text>

  <rect class="actor-box" x="50" y="685" width="30" height="20" rx="2"/>
  <text class="legend-text" x="90" y="700">Person (Usuários)</text>

  <rect class="external-box" x="50" y="720" width="30" height="20" rx="2"/>
  <text class="legend-text" x="90" y="735">External System (APIs de terceiros)</text>

  <!-- Metadata -->
  <text class="subtitle" x="600" y="770" text-anchor="middle">Diagrama C4 - Nível 1: Context | Location404 TCC</text>
</svg>
