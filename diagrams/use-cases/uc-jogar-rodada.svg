<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #a0a0a0; }

      .actor-body { fill: none; stroke: #51B059; stroke-width: 3; }
      .actor-head { fill: #51B059; }
      .actor-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #51B059; text-anchor: middle; }

      .system-boundary { fill: none; stroke: #3B96E6; stroke-width: 2; stroke-dasharray: 5,5; }
      .system-label { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #3B96E6; }

      .usecase-box { fill: #3B96E6; stroke: #2a7bc4; stroke-width: 2; }
      .usecase-label { font-family: Arial, sans-serif; font-size: 14px; fill: #ffffff; text-anchor: middle; }
      .usecase-id { font-family: Arial, sans-serif; font-size: 11px; fill: #e0e0e0; text-anchor: middle; font-style: italic; }

      .association { stroke: #a0a0a0; stroke-width: 2; fill: none; }
      .include-line { stroke: #51B059; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .extend-line { stroke: #DC382D; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .relationship-label { font-family: Arial, sans-serif; font-size: 12px; fill: #d0d0d0; text-anchor: middle; font-style: italic; }

      .legend-text { font-family: Arial, sans-serif; font-size: 13px; fill: #ffffff; }
    </style>
